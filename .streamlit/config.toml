[theme]
font = "sans-serif"
baseRadius = "medium"
buttonRadius = "medium"
showWidgetBorder = true

[theme.light]
primaryColor = "#4F6B82"
backgroundColor = "#F7F9FC"
secondaryBackgroundColor = "#FFFFFF"
textColor = "#0F172A"
borderColor = "#D7DEE8"
linkColor = "#4F6B82"

[theme.dark]
primaryColor = "#8AA0B4"
backgroundColor = "#0B1120"
secondaryBackgroundColor = "#111827"
textColor = "#F8FAFC"
borderColor = "#334155"
linkColor = "#A7B6C3"
