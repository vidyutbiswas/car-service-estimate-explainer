[theme]
font = "sans-serif"
baseRadius = "medium"
buttonRadius = "medium"
showWidgetBorder = true

[theme.light]
primaryColor = "#627F98"
backgroundColor = "#F6F7F8"
secondaryBackgroundColor = "#FFFFFF"
textColor = "#202124"
borderColor = "#D7DEE4"
linkColor = "#526F86"

[theme.dark]
primaryColor = "#9CB1C1"
backgroundColor = "#111418"
secondaryBackgroundColor = "#1B2026"
textColor = "#F1F3F4"
borderColor = "#36404A"
linkColor = "#AEC1CF"
