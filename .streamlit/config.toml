[theme]
font = "sans-serif"
baseRadius = "medium"
buttonRadius = "medium"
showWidgetBorder = true

[theme.light]
primaryColor = "#607D93"
backgroundColor = "#F7F7F5"
secondaryBackgroundColor = "#FFFFFF"
textColor = "#1D1D1F"
borderColor = "#D9DDE2"
linkColor = "#526F86"

[theme.dark]
primaryColor = "#9BB0C0"
backgroundColor = "#0F1115"
secondaryBackgroundColor = "#171A20"
textColor = "#F5F5F7"
borderColor = "#30343B"
linkColor = "#AFC0CC"
